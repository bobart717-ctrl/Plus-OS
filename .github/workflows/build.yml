name: Build Plus OS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Пробуем Linux для стабильности сети

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      # Пробуем форсированный поиск
      run: dotnet restore PlusOS.csproj --configfile nuget.config --verbosity normal

    - name: Build Project
      run: dotnet build PlusOS.csproj --configuration Release --no-restore
