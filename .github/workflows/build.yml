name: Build Plus OS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Binary (Native AOT)
      # Добавляем флаг -o для точного указания папки выхода
      run: dotnet publish PlusOS.csproj -c Release -r linux-x64 --self-contained true /p:PublishAot=true -o ./publish_output

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlusOS-Binary
        # Теперь мы точно знаем, где лежит файл, потому что сами указали папку ./publish_output
        path: ./publish_output/PlusOS
